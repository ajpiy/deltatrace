[project]
name = "deltatrace"
version = "0.3.0"
description = "DeltaTrace: spatially regularized trajectory inference for single-cell and spatial transcriptomic data via graph-based optimal transport"
readme = "README.md"
authors = [
    { name = "Avery Paulsen" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["trajectory-inference", "spatial-transcriptomics", "single-cell", "optimal-transport", "scanpy"]

requires-python = ">=3.12"
# Floors are the oldest releases the code is tested against (see CHANGELOG), not the
# newest ones the dev environment happens to hold, so the package resolves inside an
# existing scanpy environment. Everything the source imports is listed, including
# natsort (imported directly).
dependencies = [
    "anndata>=0.10",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "natsort>=8",
    "networkx>=3.2",
    "numba>=0.56",
    "numpy>=1.26",
    "pandas>=2.1.1",
    "pot>=0.9.4",
    "pyamg>=5.3",
    "scanpy>=1.10",
    "scipy>=1.12",
]

[project.optional-dependencies]
# Only the example notebooks need these: Leiden clustering through scanpy. DeltaTrace
# itself takes clusters as input (obs[cluster_key]) and never imports them.
examples = [
    "igraph>=0.11",
    "leidenalg>=0.10",
]

[project.urls]
Homepage = "https://github.com/ajpiy/deltatrace"
Repository = "https://github.com/ajpiy/deltatrace"
Issues = "https://github.com/ajpiy/deltatrace/issues"

[dependency-groups]
dev = [
    # The [examples] extra (scanpy's Leiden clustering) is part of the dev group.
    "igraph>=0.11",
    "leidenalg>=0.10",
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.8",
    "pytest>=8",
    "ruff>=0.15.16",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Exploratory notebooks are not held to source style: cells get reordered, imports land
# where they are first needed. Excluding them keeps a bare `ruff check` meaningful in CI.
exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: the numerics and their comments read better wide
    "E702",    # `x = 1; continue` — deliberate compact style in _lineages.py
    "RUF022",  # __all__ is ordered by pipeline stage, not alphabetically
    "SIM300",  # `J > edge_threshold` reads better than `edge_threshold < J`
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Examples print wall-clock timings, which differ run to run; "..." elides them.
doctest_optionflags = ["ELLIPSIS"]
